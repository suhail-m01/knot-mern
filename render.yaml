services:
  - type: web
    name: knot-mern
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        value: mongodb+srv://knot_app_user:Knot123@knotcluster.qjwfzhf.mongodb.net/knot_mern?retryWrites=true&w=majority
      - key: VITE_DATA_PROVIDER
        value: local
      - key: NEXT_PUBLIC_ENABLE_HACKATHONS
        value: "true"
      - key: VITE_ENABLE_HACKATHONS
        value: "true"
